[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruta-del-agua-backend"
version = "0.1.0"
description = "Backend base para la experiencia Ruta del Agua de Planet X SPHEREx."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3",
    "numpy>=2.1,<3",
    "astropy>=7,<9",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
b2-real = [
    "astroquery>=0.4.11,<0.5",
    "matplotlib>=3.10,<4",
]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.0,<9.0",
]

[tool.mypy]
packages = ["app.b2"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
