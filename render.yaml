services:
  - type: web
    name: ruta-del-agua-api
    runtime: python
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: API_CORS_ORIGINS
        sync: false
